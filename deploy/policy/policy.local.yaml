# Local policy: who can reach which resource and how fast.
# Loaded by air_infra.policy.engine at boot. Prod policy is the same shape but
# sourced from the secret/config backend and is enforced strictly (no default-allow).
#
# A rule grants a service a set of actions on a resource, with an optional
# per-minute rate override. `default_allow: true` is a LOCAL convenience only.
#
# HEADS UP: `rate_per_minute` (both the default and the per-service override) is
# currently INERT. The rate limiter is built at startup and the enforcement
# helper exists, but no route calls it — this was true of the Python service too
# and was carried over deliberately rather than changed during the port. Treat
# these numbers as intent, not as a control that is running. See
# internal/api/deps.go (EnforceRate) and docs/overview.md "Current Gaps".

default_allow: true
default_rate_per_minute: 120

services:
  air-classifier:
    resources:
      redis: [read, write]        # cache tier
    rate_per_minute: 300

  air-platform:
    resources:
      redis: [read, write]
      postgres: [read, write]
      mongo: [read, write]
    rate_per_minute: 600

  air-client:
    resources:
      redis: [read]
    rate_per_minute: 60
