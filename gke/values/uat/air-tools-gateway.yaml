# air-tools-gateway, UAT on GKE. Layered on gke/helm/air-service/values.yaml.
#
# Placeholders in <angle brackets> come from `terraform output` in
# gke/terraform/environments/uat, or are passed by `make gke-deploy`
# (IMAGE_REPOSITORY, GCP_PROJECT). The image is set by CI or by
# `make deploy DEPLOY_ENV=uat` in the air-tools-gateway repository.
#
# Settings: every variable is documented in that repository's .env.example.
# Only what must differ from its defaults is set here.

environment: uat

image:
  repository: <region>-docker.pkg.dev/<project>/air/air-tools-gateway

containerPort: 8080
command: [node, dist/src/main.js]

env:
  # This service has no `staging` value: UAT runs as `production`, which
  # refuses to start on the development salt.
  AIR_TOOLS_GATEWAY__APP__ENV: production
  AIR_TOOLS_GATEWAY__HTTP__PORT: "8080"
  AIR_TOOLS_GATEWAY__LOG__FORMAT: json
  # The only backend that exists: sample orders baked into the image, reset on
  # every restart. A real orders backend is application work, not a setting.
  AIR_TOOLS_GATEWAY__BACKEND__MODE: fixture
  AIR_TOOLS_GATEWAY__BACKEND__FIXTURE_DIR: /app/fixtures
  # Proposals, idempotency records and locks. Required for more than one
  # replica. The URL is the secret AIR_TOOLS_GATEWAY__STORE__REDIS_URL.
  AIR_TOOLS_GATEWAY__STORE__BACKEND: redis
  AIR_TOOLS_GATEWAY__STORE__KEY_PREFIX: "airtg-uat"
  AIR_TOOLS_GATEWAY__SHUTDOWN__DRAIN_TIMEOUT_MS: "20000"

secrets:
  mode: gcpSecretManager
  gcp:
    project: <project>
    # Setting -> Secret Manager secret id. The same map is in
    # gke/terraform/environments/<env>/main.tf, which creates the secrets.
    items:
      AIR_TOOLS_GATEWAY__SECURITY__HASH_SALT: air-tools-gateway-hash-salt
      AIR_TOOLS_GATEWAY__SECURITY__API_KEYS: air-tools-gateway-api-keys
      AIR_TOOLS_GATEWAY__STORE__REDIS_URL: air-tools-gateway-redis-url

# On SIGTERM the service turns unready and finishes running executes (up to
# the drain timeout above) before it exits.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 40

replicaCount: 1

networkPolicy:
  allowedNamespaces:
    - air-orchestrator-service
