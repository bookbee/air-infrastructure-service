# air-orchestrator-service, UAT on GKE. Layered on gke/helm/air-service/values.yaml.
#
# Placeholders in <angle brackets> come from `terraform output` in
# gke/terraform/environments/uat, or are passed by `make gke-deploy`
# (IMAGE_REPOSITORY, GCP_PROJECT). The image is set by CI or by
# `make deploy DEPLOY_ENV=uat` in the air-orchestrator-service repository.
#
# Settings: every variable is documented in that repository's .env.example.
# Only what must differ from its defaults is set here.

environment: uat

image:
  repository: <region>-docker.pkg.dev/<project>/air/air-orchestrator-service

# This image listens on 8081, not 8080.
containerPort: 8081
command: [air-orchestrator-service]

env:
  AIR_ORCHESTRATOR_SERVICE__APP__ENV: staging
  AIR_ORCHESTRATOR_SERVICE__APP__HOST: 0.0.0.0
  AIR_ORCHESTRATOR_SERVICE__APP__PORT: "8081"
  AIR_ORCHESTRATOR_SERVICE__APP__WORKERS: "1"
  AIR_ORCHESTRATOR_SERVICE__OBS__LOG_FORMAT: json
  # The model gateway: required for any answer.
  AIR_ORCHESTRATOR_SERVICE__MODEL_GATEWAY__BASE_URL: http://air-model-gateway.air-model-gateway.svc.cluster.local
  AIR_ORCHESTRATOR_SERVICE__MODEL_GATEWAY__MODEL_CLASS: cloud
  # The planner decides order lookups and proposed changes.
  AIR_ORCHESTRATOR_SERVICE__PLANNER__ENABLED: "true"
  AIR_ORCHESTRATOR_SERVICE__PLANNER__MODEL_CLASS: cloud
  # The optional services, all switched on. Their keys are secrets, below.
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__CLASSIFIER__ENABLED: "true"
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__CLASSIFIER__BASE_URL: http://air-classifier-service.air-classifier-service.svc.cluster.local
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__RAG__ENABLED: "true"
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__RAG__BASE_URL: http://air-rag-service.air-rag-service.svc.cluster.local
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__TOOLS_GATEWAY__ENABLED: "true"
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__TOOLS_GATEWAY__BASE_URL: http://air-tools-gateway.air-tools-gateway.svc.cluster.local
  AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__TOOLS_GATEWAY__ALLOW__CUSTOMER: '["orders.*"]'
  # Set per environment:
  #   the shop's name, used by the assistant (the default is "AIR")
  # AIR_ORCHESTRATOR_SERVICE__PROMPTS__PERSONA__BRAND_NAME: "<shop name>"
  #   the PUBLIC keys of whoever signs customer tokens (the shop's backend), as
  #   the JSON list .env.example shows. Without it every customer is anonymous
  #   and no per-customer lookup or change is offered.
  # AIR_ORCHESTRATOR_SERVICE__SECURITY__CUSTOMER_TOKENS: '[{"issuer":"…","tenant":"…","kid":"…","alg":"ES256","public_key":"-----BEGIN PUBLIC KEY-----\\n…"}]'

secrets:
  mode: gcpSecretManager
  gcp:
    project: <project>
    # Setting -> Secret Manager secret id. The same map is in
    # gke/terraform/environments/<env>/main.tf, which creates the secrets.
    items:
      AIR_ORCHESTRATOR_SERVICE__SECURITY__HASH_SALT: air-orchestrator-service-hash-salt
      AIR_ORCHESTRATOR_SERVICE__SECURITY__API_KEYS_INLINE: air-orchestrator-service-api-keys
      AIR_ORCHESTRATOR_SERVICE__MODEL_GATEWAY__API_KEY: air-orchestrator-service-model-gateway-token
      AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__CLASSIFIER__API_KEY: air-orchestrator-service-classifier-api-key
      AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__RAG__API_KEY: air-orchestrator-service-rag-api-key
      AIR_ORCHESTRATOR_SERVICE__DOWNSTREAM__TOOLS_GATEWAY__TENANT_KEYS: air-orchestrator-service-tools-tenant-keys

# EXACTLY ONE COPY. Sessions and pending proposals live in process memory
# (durable sessions are not built), so a second replica answers about half of
# all follow-up messages with a 404. Recreate stops the old pod before the new
# one starts: every deploy drops the conversations in progress. Do not enable
# autoscaling or raise replicaCount until durable sessions exist.
replicaCount: 1
strategy: Recreate

resources:
  requests: {cpu: 500m, memory: 512Mi, ephemeral-storage: 256Mi}
  limits: {memory: 512Mi, ephemeral-storage: 256Mi}

# ---- the front door ----------------------------------------------------------
# The one service clients reach from outside the cluster, through an internal
# load balancer: the shop's backends only, on a private address. The contract
# is this service's spec 0016; the procedure is docs/03-gke-runbook.md §5.6.
gateway:
  enabled: true
  # The DNS name the backends call. Create its record pointing at
  # `terraform output front_door` -> address.
  hostname: <front-door-hostname>
  # From `terraform output front_door`.
  addressName: air-front-door-uat
  securityPolicy: air-front-door-uat
  tls:
    # The certificate for the hostname above: a Kubernetes TLS Secret in the
    # air-orchestrator-service namespace, or (preSharedCerts) a regional SSL
    # certificate in the project.
    secretName: <front-door-tls-secret>
  # Exactly the service's public routes (spec 0016, REQ-FDR-001). /v1/health,
  # /v1/ready, /v1/capabilities, /metrics and the API documentation stay inside.
  publicPaths:
    - {type: Exact, value: /v1/chat}
    - {type: Exact, value: /v1/query}
    - {type: PathPrefix, value: /v1/sessions}
  # Four times the 15 s turn deadline (AIR_ORCHESTRATOR_SERVICE__TURN__DEADLINE_MS).
  # Raise both together.
  timeoutSec: 60

networkPolicy:
  # Nothing in the cluster calls this service. Its traffic comes from the load
  # balancer: the proxy-only subnet (`terraform output front_door` ->
  # proxy_only_cidr) and Google's health-check ranges.
  allowedNamespaces: []
  allowedCidrs:
    - 10.129.0.0/23
    - 35.191.0.0/16
    - 130.211.0.0/22
