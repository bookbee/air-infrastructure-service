{{- if .Values.serviceAccount.create }}
# The identity Workload Identity Federation maps to IAM: Secret Manager access
# is granted to this account (namespace + name) by gke/terraform, not to a key
# file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "air.serviceAccountName" . }}
  labels:
    {{- include "air.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
