{{- if eq .Values.secrets.mode "gcpSecretManager" }}
# GKE Secret Manager add-on: each Secret Manager secret becomes a file in the
# pod's secrets directory, named like the environment variable it stands in
# for. Access is the pod's own Kubernetes service account through Workload
# Identity Federation (granted per secret by gke/terraform).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "air.fullname" . }}-secrets
  labels:
    {{- include "air.labels" . | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- range $file, $secret := .Values.secrets.gcp.items }}
      - resourceName: "projects/{{ $.Values.secrets.gcp.project }}/secrets/{{ $secret }}/versions/latest"
        path: "{{ $file }}"
      {{- end }}
{{- end }}
