apiVersion: v1
kind: Service
metadata:
  name: {{ include "air.fullname" . }}
  labels:
    {{- include "air.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "air.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
