{{- if .Values.podDisruptionBudget.enabled }}
# Node upgrades and Autopilot rebalancing evict at most this many replicas at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "air.fullname" . }}
  labels:
    {{- include "air.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "air.selectorLabels" . | nindent 6 }}
{{- end }}
